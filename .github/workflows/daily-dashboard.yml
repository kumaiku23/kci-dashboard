name: Weekly Market Pressure Gauge

on:
  workflow_dispatch:
  schedule:
    # 7:30 AM America/Los_Angeles. UTC shifts with daylight saving time.
    - cron: "30 14 * * 1"
    - cron: "30 15 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-dashboard-main
  cancel-in-progress: true

env:
  TZ: America/Los_Angeles

jobs:
  publish:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run: ${{ steps.schedule.outputs.run }}
      report_date: ${{ steps.validate.outputs.report_date }}
      week_of_date: ${{ steps.validate.outputs.week_of_date }}
      iso_date: ${{ steps.validate.outputs.iso_date }}
      stress_score: ${{ steps.validate.outputs.stress_score }}
      opportunity_score: ${{ steps.validate.outputs.opportunity_score }}
      dashboard_sha: ${{ steps.report.outputs.sha }}
    steps:
      - name: Check schedule window
        id: schedule
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SCHEDULE="${{ github.event.schedule }}"
          LOCAL_ZONE="$(date +%Z)"
          if { [ "$SCHEDULE" = "30 14 * * 1" ] && [ "$LOCAL_ZONE" = "PDT" ]; } || \
             { [ "$SCHEDULE" = "30 15 * * 1" ] && [ "$LOCAL_ZONE" = "PST" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate daylight-saving schedule: $SCHEDULE fired while America/Los_Angeles is $LOCAL_ZONE."
          fi

      - name: Check out main
        if: steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Set up Node.js
        if: steps.schedule.outputs.run == 'true'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        if: steps.schedule.outputs.run == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate dashboard
        if: steps.schedule.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cp data.json "$RUNNER_TEMP/data.json.before"
          if [ -d history ]; then
            cp -R history "$RUNNER_TEMP/history.before"
          fi

          for attempt in 1 2 3; do
            echo "Weekly gauge generation attempt $attempt of 3"
            if node scripts/generate-dashboard.mjs 2>&1 | tee "$RUNNER_TEMP/generate-dashboard-attempt-$attempt.log"; then
              echo "Weekly gauge generation succeeded on attempt $attempt."
              exit 0
            fi

            cp "$RUNNER_TEMP/data.json.before" data.json
            if [ -d "$RUNNER_TEMP/history.before" ]; then
              rm -rf history
              cp -R "$RUNNER_TEMP/history.before" history
            else
              rm -rf history
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Weekly gauge generation failed on attempt $attempt; retrying in 30 seconds."
              sleep 30
            fi
          done

          echo "::error::Weekly gauge generation failed after 3 attempts. Restored existing data.json; no partial files will be committed."
          exit 1

      - name: Stale-dashboard watchdog
        if: steps.schedule.outputs.run == 'true'
        run: node scripts/validate-dashboard-run.mjs
        id: validate

      - name: Generate PDF artifact
        if: steps.schedule.outputs.run == 'true'
        id: pdf
        run: |
          mkdir -p artifacts
          PDF_FILE="market-pressure-gauge-${{ steps.validate.outputs.iso_date }}.pdf"
          PDF_PATH="artifacts/$PDF_FILE"
          echo "pdf_file=$PDF_FILE" >> "$GITHUB_OUTPUT"
          echo "pdf_path=$PDF_PATH" >> "$GITHUB_OUTPUT"
          python3 -m http.server 8080 > "$RUNNER_TEMP/dashboard-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 1
          done

          if command -v google-chrome >/dev/null; then
            google-chrome --headless --disable-gpu --no-sandbox --print-to-pdf="$PDF_PATH" http://127.0.0.1:8080/
          elif command -v chromium-browser >/dev/null; then
            chromium-browser --headless --disable-gpu --no-sandbox --print-to-pdf="$PDF_PATH" http://127.0.0.1:8080/
          else
            echo "::error::No headless Chrome binary found; PDF generation failed."
            exit 1
          fi

          node scripts/validate-pdf.mjs "$PDF_PATH"

      - name: Upload PDF to Google Drive
        if: steps.schedule.outputs.run == 'true'
        id: drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          if [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ] || [ -z "${GOOGLE_DRIVE_FOLDER_ID:-}" ]; then
            echo "::warning::Google Drive upload skipped because GOOGLE_SERVICE_ACCOUNT_JSON or GOOGLE_DRIVE_FOLDER_ID is not configured."
            echo "drive_file_id=" >> "$GITHUB_OUTPUT"
            echo "drive_upload_status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Google Drive upload attempt $attempt of 3"
            if node scripts/upload-pdf-to-drive.mjs "${{ steps.pdf.outputs.pdf_path }}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Google Drive upload failed on attempt $attempt; retrying in 20 seconds."
              sleep 20
            fi
          done

          echo "::error::Google Drive upload failed after 3 attempts."
          exit 1

      - name: Print git status and diff
        if: steps.schedule.outputs.run == 'true'
        run: |
          git status
          git diff --stat

      - name: Commit and push changes
        if: steps.schedule.outputs.run == 'true'
        id: report
        run: |
          if git diff --quiet -- data.json history/index.json history/*.json; then
            echo "No dashboard changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "heartbeat_status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history/index.json history/*.json
          git commit -m "Publish dashboard ${{ steps.validate.outputs.iso_date }}"
          git push origin main
          DASHBOARD_SHA="$(git rev-parse HEAD)"

          node scripts/write-heartbeat.mjs \
            --report-date "${{ steps.validate.outputs.report_date }}" \
            --stress-score "${{ steps.validate.outputs.stress_score }}" \
            --opportunity-score "${{ steps.validate.outputs.opportunity_score }}" \
            --commit "$DASHBOARD_SHA" \
            --history-file "${{ steps.validate.outputs.history_file }}" \
            --pdf-file "${{ steps.pdf.outputs.pdf_file }}" \
            --drive-upload-status "${{ steps.drive.outputs.drive_upload_status }}"

          git add heartbeat.json
          git commit -m "Update dashboard heartbeat ${{ steps.validate.outputs.iso_date }}"
          git push origin main

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$DASHBOARD_SHA" >> "$GITHUB_OUTPUT"
          echo "heartbeat_status=success" >> "$GITHUB_OUTPUT"

      - name: Prepare workflow artifacts
        if: steps.schedule.outputs.run == 'true'
        run: |
          mkdir -p artifacts
          cp data.json artifacts/data.json
          cp "${{ steps.validate.outputs.history_file }}" "artifacts/${{ steps.validate.outputs.iso_date }}.json"
          if [ -f heartbeat.json ]; then
            cp heartbeat.json artifacts/heartbeat.json
          fi
          {
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            for log in "$RUNNER_TEMP"/generate-dashboard-attempt-*.log "$RUNNER_TEMP"/dashboard-http.log; do
              if [ -f "$log" ]; then
                echo
                echo "===== $(basename "$log") ====="
                cat "$log"
              fi
            done
          } > artifacts/workflow.log
          if [ ! -s artifacts/workflow.log ] && [ -n "${GITHUB_RUN_ID:-}" ]; then
            {
              echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo "Full workflow log is available in GitHub Actions."
            } > artifacts/workflow.log
          fi

      - name: Upload dashboard artifacts
        if: steps.schedule.outputs.run == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: market-pressure-gauge-${{ steps.validate.outputs.iso_date }}
          path: artifacts/
          retention-days: 90
          if-no-files-found: warn

      - name: Publish summary
        if: steps.schedule.outputs.run == 'true'
        run: |
          echo "Commit SHA: ${{ steps.report.outputs.sha }}"
          echo "Publication date: ${{ steps.validate.outputs.report_date }}"
          echo "Week of: ${{ steps.validate.outputs.week_of_date }}"
          echo "Market Pressure Score: ${{ steps.validate.outputs.stress_score }}"
          echo "Opportunity score: ${{ steps.validate.outputs.opportunity_score }}"
          echo "PDF filename: ${{ steps.pdf.outputs.pdf_file }}"
          echo "Google Drive file ID: ${{ steps.drive.outputs.drive_file_id }}"
          echo "Drive upload status: ${{ steps.drive.outputs.drive_upload_status }}"
          echo "heartbeat.json status: ${{ steps.report.outputs.heartbeat_status }}"
          echo "History filename: ${{ steps.validate.outputs.history_file }}"
          {
            echo "### Weekly Market Pressure Gauge"
            echo "- Publication date: ${{ steps.validate.outputs.report_date }}"
            echo "- Week of: ${{ steps.validate.outputs.week_of_date }}"
            echo "- Commit SHA: ${{ steps.report.outputs.sha }}"
            echo "- Market Pressure Score: ${{ steps.validate.outputs.stress_score }}"
            echo "- Opportunity score: ${{ steps.validate.outputs.opportunity_score }}"
            echo "- PDF filename: ${{ steps.pdf.outputs.pdf_file }}"
            echo "- Google Drive file ID: ${{ steps.drive.outputs.drive_file_id }}"
            echo "- Drive upload status: ${{ steps.drive.outputs.drive_upload_status }}"
            echo "- heartbeat.json status: ${{ steps.report.outputs.heartbeat_status }}"
            echo "- History filename: ${{ steps.validate.outputs.history_file }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore dashboard state on failure
        if: failure() && steps.schedule.outputs.run == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/data.json.before" ]; then
            cp "$RUNNER_TEMP/data.json.before" data.json
          fi
          if [ -d "$RUNNER_TEMP/history.before" ]; then
            rm -rf history
            cp -R "$RUNNER_TEMP/history.before" history
          else
            rm -rf history
          fi
          rm -f heartbeat.json
          echo "Restored prior dashboard state after failure."

      - name: Final status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Weekly Market Pressure Gauge Published Successfully"
          else
            echo "❌ Weekly Market Pressure Gauge Publish Failed"
          fi

  deploy-pages:
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out published main
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Download generated dashboard artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: market-pressure-gauge-${{ needs.publish.outputs.iso_date }}
          path: workflow-artifact

      - name: Prepare and validate static site
        id: site
        env:
          EXPECTED_REPORT_DATE: ${{ needs.publish.outputs.report_date }}
          EXPECTED_ISO_DATE: ${{ needs.publish.outputs.iso_date }}
        run: |
          test -f index.html
          test -f data.json
          test -f "history/${EXPECTED_ISO_DATE}.json"

          PDF_FILE="market-pressure-gauge-${EXPECTED_ISO_DATE}.pdf"
          PDF_SOURCE="workflow-artifact/${PDF_FILE}"
          test -f "$PDF_SOURCE"
          PDF_SIZE="$(stat -c%s "$PDF_SOURCE")"
          if [ "$PDF_SIZE" -le 10240 ]; then
            echo "::error::Generated PDF is too small: ${PDF_SOURCE} is ${PDF_SIZE} bytes."
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("data.json", "utf8"));
            if (data.date !== process.env.EXPECTED_REPORT_DATE) {
              throw new Error(`Expected ${process.env.EXPECTED_REPORT_DATE}, found ${data.date}`);
            }
            if (!Number.isFinite(data.composite?.stressScore)) {
              throw new Error("data.json is missing composite.stressScore");
            }
            process.stdout.write(`${data.date}\n${data.composite.stressScore}\n`);
          ' > "$RUNNER_TEMP/dashboard-metadata"

          {
            IFS= read -r report_date
            IFS= read -r stress_score
            echo "report_date=$report_date"
            echo "stress_score=$stress_score"
          } < "$RUNNER_TEMP/dashboard-metadata" >> "$GITHUB_OUTPUT"

          echo "Deploying dashboard date: $(head -n 1 "$RUNNER_TEMP/dashboard-metadata")"
          echo "Deploying stress score: $(tail -n 1 "$RUNNER_TEMP/dashboard-metadata")"

          rm -rf _site
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'artifacts/' \
            --exclude 'logs/' \
            --exclude 'scripts/' \
            --exclude 'test/' \
            --exclude 'macos/' \
            --exclude 'package*.json' \
            --exclude '*.md' \
            --exclude '.gitignore' \
            --exclude '.local-dashboard.env*' \
            ./ _site/
          mkdir -p _site/reports
          cp "$PDF_SOURCE" _site/latest.pdf
          cp "$PDF_SOURCE" "_site/reports/${EXPECTED_ISO_DATE}.pdf"
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/data.json
          test -f "_site/history/${EXPECTED_ISO_DATE}.json"
          test -f _site/latest.pdf
          test -f "_site/reports/${EXPECTED_ISO_DATE}.pdf"
          test "$(stat -c%s _site/latest.pdf)" -gt 10240
          test "$(stat -c%s "_site/reports/${EXPECTED_ISO_DATE}.pdf")" -gt 10240
          echo "pdf_file=reports/${EXPECTED_ISO_DATE}.pdf" >> "$GITHUB_OUTPUT"
          echo "pdf_size=$PDF_SIZE" >> "$GITHUB_OUTPUT"
          echo "PDF deployed: reports/${EXPECTED_ISO_DATE}.pdf"
          echo "PDF size: ${PDF_SIZE} bytes"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0

      - name: Verify live GitHub Pages
        id: verify-live
        env:
          EXPECTED_REPORT_DATE: ${{ needs.publish.outputs.report_date }}
          EXPECTED_ISO_DATE: ${{ needs.publish.outputs.iso_date }}
        run: |
          for attempt in $(seq 1 12); do
            if live_date="$(curl --fail --silent --show-error --location \
              "https://kumaiku23.github.io/kci-dashboard/data.json?run=${GITHUB_RUN_ID}&attempt=${attempt}" \
              | node -e 'let input=""; process.stdin.on("data", (chunk) => input += chunk); process.stdin.on("end", () => { console.log(JSON.parse(input).date); });')"; then
              echo "Live dashboard attempt $attempt: $live_date"
              if [ "$live_date" = "$EXPECTED_REPORT_DATE" ]; then
                LIVE_PDF="$RUNNER_TEMP/live-dashboard-${EXPECTED_ISO_DATE}.pdf"
                if live_pdf_response="$(curl --fail --silent --show-error --location \
                  "https://kumaiku23.github.io/kci-dashboard/reports/${EXPECTED_ISO_DATE}.pdf" \
                  --output "$LIVE_PDF" \
                  --write-out '%{http_code} %{size_download}')"; then
                  read -r live_pdf_status live_pdf_size <<< "$live_pdf_response"
                  echo "Live PDF attempt $attempt: HTTP ${live_pdf_status}, ${live_pdf_size} bytes"
                  if [ "$live_pdf_status" = "200" ] && [ "${live_pdf_size%.*}" -gt 10240 ]; then
                    echo "verified=yes" >> "$GITHUB_OUTPUT"
                    echo "live_date=$live_date" >> "$GITHUB_OUTPUT"
                    echo "live_pdf_size=$live_pdf_size" >> "$GITHUB_OUTPUT"
                    echo "✅ Live GitHub Pages verified: $live_date"
                    exit 0
                  fi
                  echo "Live PDF attempt $attempt did not return a usable PDF."
                else
                  echo "Live PDF attempt $attempt could not be fetched."
                fi
              fi
            else
              echo "Live dashboard attempt $attempt could not be fetched or parsed."
            fi

            if [ "$attempt" -lt 12 ]; then
              sleep 10
            fi
          done

          echo "verified=no" >> "$GITHUB_OUTPUT"
          echo "::error::Pages deployment completed, but the live dashboard and PDF were not verified for $EXPECTED_REPORT_DATE after 12 attempts."
          exit 1

      - name: Publish Pages deployment summary
        if: always()
        run: |
          {
            echo "### Weekly Market Pressure Gauge Pages Deployment"
            echo "- Weekly gauge generated: yes"
            echo "- Publication date: ${{ needs.publish.outputs.report_date }}"
            echo "- Week of: ${{ needs.publish.outputs.week_of_date }}"
            echo "- Market Pressure Score: ${{ needs.publish.outputs.stress_score }}"
            echo "- Dashboard commit SHA: ${{ needs.publish.outputs.dashboard_sha }}"
            echo "- Pages deployment: ${{ steps.deployment.outcome }}"
            echo "- Live site verified: ${{ steps.verify-live.outputs.verified || 'no' }}"
            echo "- Live dashboard date: ${{ steps.verify-live.outputs.live_date || 'not verified' }}"
            echo "- PDF deployed: ${{ steps.site.outputs.pdf_file || 'not deployed' }}"
            echo "- Live PDF size: ${{ steps.verify-live.outputs.live_pdf_size || 'not verified' }} bytes"
            echo "- Public URL: https://kumaiku23.github.io/kci-dashboard/"
          } >> "$GITHUB_STEP_SUMMARY"
