name: Daily Market Stress Dashboard

on:
  workflow_dispatch:
  schedule:
    # 1:30 PM America/Los_Angeles. UTC shifts with daylight saving time.
    - cron: "30 20 * * 1-5"
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-dashboard-main
  cancel-in-progress: true

env:
  TZ: America/Los_Angeles

jobs:
  publish:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check schedule window
        id: schedule
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SCHEDULE="${{ github.event.schedule }}"
          LOCAL_ZONE="$(date +%Z)"
          if { [ "$SCHEDULE" = "30 20 * * 1-5" ] && [ "$LOCAL_ZONE" = "PDT" ]; } || \
             { [ "$SCHEDULE" = "30 21 * * 1-5" ] && [ "$LOCAL_ZONE" = "PST" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate daylight-saving schedule: $SCHEDULE fired while America/Los_Angeles is $LOCAL_ZONE."
          fi

      - name: Check out main
        if: steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        if: steps.schedule.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        if: steps.schedule.outputs.run == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate dashboard
        if: steps.schedule.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cp data.json "$RUNNER_TEMP/data.json.before"
          if [ -d history ]; then
            cp -R history "$RUNNER_TEMP/history.before"
          fi

          for attempt in 1 2 3; do
            echo "Dashboard generation attempt $attempt of 3"
            if node scripts/generate-dashboard.mjs 2>&1 | tee "$RUNNER_TEMP/generate-dashboard-attempt-$attempt.log"; then
              echo "Dashboard generation succeeded on attempt $attempt."
              exit 0
            fi

            cp "$RUNNER_TEMP/data.json.before" data.json
            if [ -d "$RUNNER_TEMP/history.before" ]; then
              rm -rf history
              cp -R "$RUNNER_TEMP/history.before" history
            else
              rm -rf history
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Dashboard generation failed on attempt $attempt; retrying in 30 seconds."
              sleep 30
            fi
          done

          echo "::error::Dashboard generation failed after 3 attempts. Restored existing data.json; no partial files will be committed."
          exit 1

      - name: Stale-dashboard watchdog
        if: steps.schedule.outputs.run == 'true'
        run: node scripts/validate-dashboard-run.mjs
        id: validate

      - name: Generate PDF artifact
        if: steps.schedule.outputs.run == 'true'
        id: pdf
        run: |
          mkdir -p artifacts
          PDF_FILE="market-stress-dashboard-${{ steps.validate.outputs.iso_date }}.pdf"
          PDF_PATH="artifacts/$PDF_FILE"
          echo "pdf_file=$PDF_FILE" >> "$GITHUB_OUTPUT"
          echo "pdf_path=$PDF_PATH" >> "$GITHUB_OUTPUT"
          python3 -m http.server 8080 > "$RUNNER_TEMP/dashboard-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 1
          done

          if command -v google-chrome >/dev/null; then
            google-chrome --headless --disable-gpu --no-sandbox --print-to-pdf="$PDF_PATH" http://127.0.0.1:8080/
          elif command -v chromium-browser >/dev/null; then
            chromium-browser --headless --disable-gpu --no-sandbox --print-to-pdf="$PDF_PATH" http://127.0.0.1:8080/
          else
            echo "::error::No headless Chrome binary found; PDF generation failed."
            exit 1
          fi

          node scripts/validate-pdf.mjs "$PDF_PATH"

      - name: Upload PDF to Google Drive
        if: steps.schedule.outputs.run == 'true'
        id: drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          for attempt in 1 2 3; do
            echo "Google Drive upload attempt $attempt of 3"
            if node scripts/upload-pdf-to-drive.mjs "${{ steps.pdf.outputs.pdf_path }}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Google Drive upload failed on attempt $attempt; retrying in 20 seconds."
              sleep 20
            fi
          done

          echo "::error::Google Drive upload failed after 3 attempts."
          exit 1

      - name: Print git status and diff
        if: steps.schedule.outputs.run == 'true'
        run: |
          git status
          git diff --stat

      - name: Commit and push changes
        if: steps.schedule.outputs.run == 'true'
        id: report
        run: |
          if git diff --quiet -- data.json history/index.json history/*.json; then
            echo "No dashboard changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "heartbeat_status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history/index.json history/*.json
          git commit -m "Publish dashboard ${{ steps.validate.outputs.iso_date }}"
          git push origin main
          DASHBOARD_SHA="$(git rev-parse HEAD)"

          node scripts/write-heartbeat.mjs \
            --report-date "${{ steps.validate.outputs.report_date }}" \
            --stress-score "${{ steps.validate.outputs.stress_score }}" \
            --opportunity-score "${{ steps.validate.outputs.opportunity_score }}" \
            --commit "$DASHBOARD_SHA" \
            --history-file "${{ steps.validate.outputs.history_file }}" \
            --pdf-file "${{ steps.pdf.outputs.pdf_file }}" \
            --drive-upload-status "${{ steps.drive.outputs.drive_upload_status }}"

          git add heartbeat.json
          git commit -m "Update dashboard heartbeat ${{ steps.validate.outputs.iso_date }}"
          git push origin main

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$DASHBOARD_SHA" >> "$GITHUB_OUTPUT"
          echo "heartbeat_status=success" >> "$GITHUB_OUTPUT"

      - name: Prepare workflow artifacts
        if: steps.schedule.outputs.run == 'true'
        run: |
          mkdir -p artifacts
          cp data.json artifacts/data.json
          cp "${{ steps.validate.outputs.history_file }}" "artifacts/${{ steps.validate.outputs.iso_date }}.json"
          if [ -f heartbeat.json ]; then
            cp heartbeat.json artifacts/heartbeat.json
          fi
          {
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            for log in "$RUNNER_TEMP"/generate-dashboard-attempt-*.log "$RUNNER_TEMP"/dashboard-http.log; do
              if [ -f "$log" ]; then
                echo
                echo "===== $(basename "$log") ====="
                cat "$log"
              fi
            done
          } > artifacts/workflow.log
          if [ ! -s artifacts/workflow.log ] && [ -n "${GITHUB_RUN_ID:-}" ]; then
            {
              echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo "Full workflow log is available in GitHub Actions."
            } > artifacts/workflow.log
          fi

      - name: Upload dashboard artifacts
        if: steps.schedule.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: market-stress-dashboard-${{ steps.validate.outputs.iso_date }}
          path: artifacts/
          retention-days: 90
          if-no-files-found: warn

      - name: Publish summary
        if: steps.schedule.outputs.run == 'true'
        run: |
          echo "Commit SHA: ${{ steps.report.outputs.sha }}"
          echo "Report date: ${{ steps.validate.outputs.report_date }}"
          echo "Stress score: ${{ steps.validate.outputs.stress_score }}"
          echo "Opportunity score: ${{ steps.validate.outputs.opportunity_score }}"
          echo "PDF filename: ${{ steps.pdf.outputs.pdf_file }}"
          echo "Google Drive file ID: ${{ steps.drive.outputs.drive_file_id }}"
          echo "Drive upload status: ${{ steps.drive.outputs.drive_upload_status }}"
          echo "heartbeat.json status: ${{ steps.report.outputs.heartbeat_status }}"
          echo "History filename: ${{ steps.validate.outputs.history_file }}"
          {
            echo "### Market Stress Dashboard"
            echo "- Dashboard date: ${{ steps.validate.outputs.report_date }}"
            echo "- Commit SHA: ${{ steps.report.outputs.sha }}"
            echo "- Stress score: ${{ steps.validate.outputs.stress_score }}"
            echo "- Opportunity score: ${{ steps.validate.outputs.opportunity_score }}"
            echo "- PDF filename: ${{ steps.pdf.outputs.pdf_file }}"
            echo "- Google Drive file ID: ${{ steps.drive.outputs.drive_file_id }}"
            echo "- Drive upload status: ${{ steps.drive.outputs.drive_upload_status }}"
            echo "- heartbeat.json status: ${{ steps.report.outputs.heartbeat_status }}"
            echo "- History filename: ${{ steps.validate.outputs.history_file }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore dashboard state on failure
        if: failure() && steps.schedule.outputs.run == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/data.json.before" ]; then
            cp "$RUNNER_TEMP/data.json.before" data.json
          fi
          if [ -d "$RUNNER_TEMP/history.before" ]; then
            rm -rf history
            cp -R "$RUNNER_TEMP/history.before" history
          else
            rm -rf history
          fi
          rm -f heartbeat.json
          echo "Restored prior dashboard state after failure."

      - name: Final status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Dashboard Published Successfully"
          else
            echo "❌ Dashboard Publish Failed"
          fi
