<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Stress Dashboard — Kuma Capital Investments</title>
<style>
  :root{
    --paper:#fbfaf7;
    --panel:#ffffff;
    --ink:#16181d;
    --muted:#6b7280;
    --faint:#9ca3af;
    --line:#e2ded4;
    --line-strong:#cfc9bc;
    --accent:#1f3a5f;
    --accent-soft:#eef2f7;
    --g:#15803d; --g-bg:#e8f4ec;
    --y:#b88407; --y-bg:#fbf3dc;
    --o:#d9580f; --o-bg:#fbe9da;
    --r:#c62828; --r-bg:#fbe4e4;
    --serif:Georgia,"Times New Roman",serif;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#efece4;color:var(--ink);font-family:var(--sans);
    -webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .tabnum{font-variant-numeric:tabular-nums}

  /* ---------- Editor (screen only) ---------- */
  .editor{max-width:980px;margin:18px auto 4px;background:var(--panel);
    border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
  .editor summary{cursor:pointer;padding:14px 18px;font-weight:600;font-size:14px;
    background:var(--accent);color:#fff;list-style:none}
  .editor summary::-webkit-details-marker{display:none}
  .editor summary .hint{font-weight:400;opacity:.8;margin-left:8px;font-size:12px}
  .editor-body{padding:16px 18px}
  .editor textarea{width:100%;height:260px;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12px;line-height:1.5;border:1px solid var(--line-strong);border-radius:8px;
    padding:12px;resize:vertical;background:#fcfcfb;color:#1f2430}
  .toolbar{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
  button{font-family:var(--sans);font-size:13px;font-weight:600;padding:9px 16px;border-radius:8px;
    border:1px solid var(--line-strong);background:#fff;color:var(--ink);cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.go{background:var(--g);border-color:var(--g);color:#fff}
  button:hover{filter:brightness(.97)}
  #msg{font-size:12px;color:var(--muted)}
  #msg.err{color:var(--r)}

  /* ---------- Paper / pages ---------- */
  .stage{padding:18px 12px 60px}
  .page{width:8.5in;min-height:11in;margin:0 auto 22px;background:var(--paper);
    padding:0.62in 0.6in 0.5in;box-shadow:0 1px 0 #d9d4c8,0 10px 30px rgba(0,0,0,.12);
    position:relative;display:flex;flex-direction:column}

  /* Masthead */
  .mast{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px}
  .mast .eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  .mast h1{font-family:var(--serif);font-weight:700;font-size:30px;margin:4px 0 2px;letter-spacing:-.01em}
  .mast .sub{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
  .mast .date{font-size:13px;color:var(--ink)}
  .mast .conf{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}

  .secthead{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
    font-weight:700;border-bottom:1px solid var(--line);padding-bottom:5px;margin:0 0 10px}
  .page-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:7px;
    display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--faint)}

  /* ----- Summary page ----- */
  .scoregrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
  .scorecard{border:1px solid var(--line-strong);border-radius:10px;padding:14px 16px;background:#fff}
  .scorecard .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .scorecard .row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:2px}
  .scorecard .num{font-family:var(--serif);font-size:46px;line-height:1;font-weight:700}
  .scorecard .num .of{font-size:18px;color:var(--faint);font-weight:400}
  .scorecard .spark{margin-top:4px}
  .pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:3px 9px;border-radius:999px}
  .strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line-strong);
    border-radius:10px;overflow:hidden;margin-bottom:16px}
  .strip .cell{padding:11px 14px;border-right:1px solid var(--line)}
  .strip .cell:last-child{border-right:none}
  .strip .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .strip .v{font-family:var(--serif);font-size:19px;font-weight:700;margin-top:3px}
  .strip .v small{font-size:12px;font-weight:400;color:var(--muted);font-family:var(--sans)}

  .two{display:grid;grid-template-columns:1.15fr 1fr;gap:18px}
  .bars .bar-row{display:grid;grid-template-columns:96px 1fr 26px;align-items:center;gap:10px;margin-bottom:9px}
  .bars .bar-row .bl{font-size:11.5px;color:var(--ink)}
  .track{height:9px;border-radius:5px;background:#eceae3;overflow:hidden}
  .fill{display:block;height:9px;border-radius:5px}
  .bars .bv{font-size:11px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

  .breaks .b-row{display:grid;grid-template-columns:1fr 56px;align-items:center;gap:8px;margin-bottom:8px}
  .breaks .b-name{font-size:12px}
  .breaks .b-bar{grid-column:1 / -1;height:7px;border-radius:4px;background:#eceae3;overflow:hidden;margin-top:-4px}
  .breaks .b-fill{display:block;height:7px;background:#1f3a5f}
  .b-bar{height:7px;border-radius:4px;background:#eceae3;overflow:hidden}
  .b-fill{display:block;height:7px;background:#1f3a5f}
  .breaks .b-pct{font-size:12px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

  .takeaway{margin-top:14px;border-left:3px solid var(--accent);background:var(--accent-soft);
    padding:11px 14px;border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.5}
  .takeaway b{font-family:var(--serif)}

  /* ----- Tables ----- */
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    text-align:left;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line-strong)}
  td{padding:6px 8px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  .num-col{text-align:right;font-variant-numeric:tabular-nums}

  /* traffic grid */
  .tl-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
  .tl-row{display:grid;grid-template-columns:16px 1fr 22px;align-items:center;gap:9px;
    padding:6px 2px;border-bottom:1px solid var(--line)}
  .dot{width:12px;height:12px;border-radius:50%}
  .tl-name{font-size:12px}
  .tl-trend{font-size:13px;text-align:center;color:var(--muted)}

  .status-cell{display:inline-flex;align-items:center;gap:7px}
  .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .block{margin-bottom:16px}
  .arrow-up{color:var(--r)} .arrow-down{color:var(--g)} .arrow-flat{color:var(--faint)}
  .arrow-up.good{color:var(--g)} .arrow-down.good{color:var(--r)}

  .regime-box{border:1px solid var(--line-strong);border-radius:10px;padding:12px 14px;background:#fff}
  .regime-flow{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px}
  .regime-flow .now{font-family:var(--serif);font-size:16px;font-weight:700}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .act-card{border:1px solid var(--line-strong);border-radius:10px;padding:12px 14px;background:#fff}
  .act-card.do{border-top:3px solid var(--g)}
  .act-card.dont{border-top:3px solid var(--r)}
  .act-card h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .act-card ul{margin:0;padding:0;list-style:none}
  .act-card li{font-size:12px;padding:5px 0 5px 20px;position:relative;border-bottom:1px solid var(--line)}
  .act-card li:last-child{border-bottom:none}
  .act-card.do li::before{content:"✓";position:absolute;left:0;color:var(--g);font-weight:700}
  .act-card.dont li::before{content:"✕";position:absolute;left:0;color:var(--r);font-weight:700}

  .disclosure{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);
    font-size:8.5px;line-height:1.55;color:var(--faint);text-align:justify}
  .disclosure b{color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-size:8.5px}

  .track,.fill,.dot,.badge,.b-fill,.b-bar,.pill,.scorecard,.strip,.regime-box,.act-card,.status-cell .badge{
    -webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
  @media print{
    html,body{background:#fff}
    .editor,.printbar{display:none!important}
    .stage{padding:0}
    .page{box-shadow:none;margin:0;width:auto;min-height:auto;padding:0}
    @page{size:Letter;margin:0.5in}
    .page{page-break-after:always}
    .page:last-child{page-break-after:auto}
  }
  .printbar{position:sticky;top:0;z-index:5;background:#efece4;text-align:center;padding:10px}

  .toolbar-fixed{position:sticky;top:0;z-index:10;display:flex;justify-content:flex-end;gap:10px;
    padding:10px 14px;background:#efece4}
  .toolbar-fixed button{font-family:var(--sans);font-size:13px;font-weight:600;padding:8px 16px;
    border-radius:8px;border:1px solid var(--line-strong);background:var(--accent);color:#fff;cursor:pointer}
  .localnote{max-width:8.5in;margin:0 auto 10px;font-family:var(--sans);font-size:11px;color:var(--muted);
    background:#fff7e6;border:1px solid #f0e2bf;border-radius:8px;padding:8px 12px}
  @media print{ .toolbar-fixed{display:none!important} .localnote{display:none!important} }
</style>
</head>

const esc = s => String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function scoreColor(v){ if(v>=8.5)return '#c62828'; if(v>=7)return '#d9580f'; if(v>=5)return '#b88407'; return '#15803d'; }
function driverColor(v){ if(v<4)return '#15803d'; if(v<=6)return '#b88407'; return '#c62828'; }
function oppColor(v){ if(v>=8)return '#15803d'; if(v>=6)return '#b88407'; if(v>=4)return '#d9580f'; return '#c62828'; }

function trendArrow(t){
  if(t==='up')return '<span class="arrow-up">▲</span>';
  if(t==='down')return '<span class="arrow-down">▼</span>';
  return '<span class="arrow-flat">▬</span>';
}

function sparkline(series, color){
  const w=128,h=38,pad=4;
  const min=Math.min(...series),max=Math.max(...series),rng=(max-min)||1;
  const step=(w-pad*2)/(series.length-1);
  const pts=series.map((v,i)=>[pad+i*step, h-pad-((v-min)/rng)*(h-pad*2)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L ${pts[pts.length-1][0].toFixed(1)} ${h-pad} L ${pad} ${h-pad} Z`;
  const last=pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <path d="${area}" fill="${color}" opacity="0.10"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="${color}"/>
  </svg>`;
}

function dirCell(row){
  const up = row.today>row.d30, down = row.today<row.d30;
  const good = row.goodWhenUp===true;
  if(up) return `<span class="arrow-up ${good?'good':''}">▲</span>`;
  if(down) return `<span class="arrow-down ${good?'good':''}">▼</span>`;
  return `<span class="arrow-flat">▬</span>`;
}

function foot(p){ return `<div class="page-foot"><span>Kuma Capital Investments, Inc. · kumacapitalinvestments.com</span><span>Page ${p} of 5</span></div>`; }

/* ---------- Insider sentiment ---------- */
const fmtDollar = n => n===0 ? '0' : n.toLocaleString('en-US');
function insiderSignal(buying, selling, th){
  if(buying===0 && selling===0) return {key:'yellow', label:'No activity', ratio:'—'};
  if(buying===0) return {key:'red', label:'Sell-only', ratio:'∞'};
  const r = selling/buying;
  const rTxt = r>=100 ? Math.round(r)+'×' : r.toFixed(1)+'×';
  if(r<=th.greenMaxRatio) return {key:'green', label:'Buying', ratio:rTxt};
  if(r>=th.redMinRatio) return {key:'red', label:'Sell-heavy', ratio:rTxt};
  return {key:'yellow', label:'Mixed', ratio:rTxt};
}
function insiderComposite(sectors, th){
  const tb = sectors.reduce((a,s)=>a+s.buying,0);
  const ts = sectors.reduce((a,s)=>a+s.selling,0);
  return {totalBuy:tb, totalSell:ts, sig:insiderSignal(tb, ts, th)};
}

function trendTable(rows){
  return `<table><thead><tr><th>Indicator</th><th class="num-col">90D</th><th class="num-col">30D</th><th class="num-col">Today</th><th class="num-col">Trend</th></tr></thead><tbody>`
    + rows.map(r=>`<tr><td>${esc(r.label)}</td><td class="num-col">${esc(r.d90)}</td><td class="num-col">${esc(r.d30)}</td><td class="num-col"><b>${esc(r.today)}</b></td><td class="num-col">${dirCell(r)}</td></tr>`).join('')
    + `</tbody></table>`;
}
function specTable(rows){
  return `<table><thead><tr><th>Indicator</th><th class="num-col">90D</th><th class="num-col">30D</th><th class="num-col">Today</th></tr></thead><tbody>`
    + rows.map(r=>`<tr><td>${esc(r.label)}</td><td class="num-col">${esc(r.d90)}</td><td class="num-col">${esc(r.d30)}</td><td class="num-col"><b>${esc(r.today)}</b></td></tr>`).join('')
    + `</tbody></table>`;
}

function build(d){
  const sc=d.composite, sp=d.sparklines;
  const stressC=scoreColor(sc.stressScore), oppC=oppColor(sc.opportunityScore);

  // PAGE 1 — SUMMARY
  const drivers = d.stressDrivers.map(x=>`
    <div class="bar-row"><span class="bl">${esc(x.label)}</span>
    <span class="track"><span class="fill" style="width:${x.value*10}%;background:${driverColor(x.value)}"></span></span>
    <span class="bv">${x.value}/10</span></div>`).join('');

  const breaks = d.whatBreaksFirst.slice(0,5).map(b=>`
    <div class="b-row"><span class="b-name">${esc(b.label)}</span><span class="b-pct">${b.probability}%</span>
    <span class="b-bar"><span class="b-fill" style="width:${b.probability*2.4}%"></span></span></div>`).join('');

  const page1=`<section class="page">
    <div class="mast">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px">
        <div>
          <div class="eyebrow">Daily Risk &amp; Opportunity Briefing</div>
          <h1>${esc(d.title)}</h1>
        </div>
        <img src="${LOGO}" style="height:52px;margin-top:4px" alt="Kuma Capital Investments, Inc.">
      </div>
      <div class="sub"><span class="date">${esc(d.date)}</span><span class="conf">Executive Summary</span></div>
    </div>

    <div class="scoregrid">
      <div class="scorecard">
        <div class="lbl">Composite Stress / Pressure</div>
        <div class="row"><div class="num" style="color:${stressC}">${sc.stressScore}<span class="of">/10</span></div>
          <span class="pill" style="background:${stressC};color:#fff">${sc.stressScore>=8.5?'High Risk':sc.stressScore>=7?'Elevated':sc.stressScore>=5?'Watch':'Calm'}</span></div>
        <div class="spark">${sparkline(sp.stress, stressC)}</div>
      </div>
      <div class="scorecard">
        <div class="lbl">Opportunity Score</div>
        <div class="row"><div class="num" style="color:${oppC}">${sc.opportunityScore}<span class="of">/10</span></div>
          <span class="pill" style="background:${oppC};color:#fff">${sc.opportunityScore>=8?'Favorable':sc.opportunityScore>=6?'Building':'Limited'}</span></div>
        <div class="spark">${sparkline(sp.opportunity, oppC)}</div>
      </div>
    </div>

    <div class="strip">
      <div class="cell"><div class="k">Market Regime</div><div class="v">${esc(sc.regime)} <small>${esc(sc.regimeTrend)}</small></div></div>
      <div class="cell"><div class="k">Recommended Stance</div><div class="v">${esc(sc.stance)}</div></div>
      <div class="cell"><div class="k">Posture</div><div class="v">${esc(sc.stanceNote)}</div></div>
    </div>

    <div class="two">
      <div>
        <div class="secthead">Stress drivers</div>
        <div class="bars">${drivers}</div>
      </div>
      <div>
        <div class="secthead">What breaks first</div>
        <div class="breaks">${breaks}</div>
      </div>
    </div>

    <div class="takeaway"><b>Bottom line.</b> ${esc(d.takeaway)}</div>
    ${foot(1)}
  </section>`;

  // PAGE 2 — TRAFFIC LIGHTS + BREAKS TABLE
  const tl = d.trafficLights.map(x=>{
    const s=STATUS[x.status]||STATUS.yellow;
    return `<div class="tl-row"><span class="dot" style="background:${s.c}"></span>
      <span class="tl-name">${esc(x.label)}</span><span class="tl-trend">${trendArrow(x.trend)}</span></div>`;
  }).join('');

  const breaksTable = d.whatBreaksFirst.map(b=>`<tr><td>${esc(b.label)}</td>
    <td class="num-col"><b>${b.probability}%</b></td>
    <td><span class="b-bar" style="display:block"><span class="b-fill" style="width:${b.probability*2.4}%"></span></span></td></tr>`).join('');

  const page2=`<section class="page">
    <div class="mast" style="display:flex;justify-content:space-between;align-items:center"><div><div class="eyebrow">${esc(d.date)}</div><h1 style="font-size:22px">Risk Heat Map</h1></div><img src="${LOGO}" style="height:32px" alt="KCI"></div>
    <div class="secthead">Traffic-light grid — 20 indicators</div>
    <div class="tl-grid">${tl}</div>
    <div style="display:flex;gap:18px;margin:10px 0 18px;font-size:10px;color:var(--muted);align-items:center">
      <span><span class="dot" style="background:#15803d;display:inline-block;vertical-align:-1px"></span> Low</span>
      <span><span class="dot" style="background:#b88407;display:inline-block;vertical-align:-1px"></span> Watch</span>
      <span><span class="dot" style="background:#d9580f;display:inline-block;vertical-align:-1px"></span> Elevated</span>
      <span><span class="dot" style="background:#c62828;display:inline-block;vertical-align:-1px"></span> High</span>
      <span style="margin-left:auto">▲ worsening&nbsp;&nbsp;▬ stable&nbsp;&nbsp;▼ improving</span>
    </div>
    <div class="secthead">What breaks first — probability</div>
    <table><thead><tr><th>Pressure point</th><th class="num-col">Probability</th><th>&nbsp;</th></tr></thead>
      <tbody>${breaksTable}</tbody></table>
    ${foot(2)}
  </section>`;

  // PAGE 3 — TRENDS + REGIME
  const t=d.trends;
  const rt=d.regimeTracker;
  const regSignals = rt.signals.map(s=>{
    const st=STATUS[s.status]||STATUS.yellow;
    return `<tr><td>${esc(s.label)}</td><td class="num-col"><span class="badge" style="background:${st.bg};color:${st.c}">${st.t}</span></td></tr>`;
  }).join('');

  const page3=`<section class="page">
    <div class="mast" style="display:flex;justify-content:space-between;align-items:center"><div><div class="eyebrow">${esc(d.date)}</div><h1 style="font-size:22px">Velocity &amp; Acceleration</h1></div><img src="${LOGO}" style="height:32px" alt="KCI"></div>
    <div class="secthead">Headline trend — today vs 30 / 90 days</div>
    <div class="block">${trendTable(t.headline)}</div>
    <div class="grid2">
      <div class="block"><div class="secthead">Rates</div>${trendTable(t.rates)}</div>
      <div class="block"><div class="secthead">Credit</div>${trendTable(t.credit)}</div>
    </div>
    <div class="grid2">
      <div class="block"><div class="secthead">Speculation</div>${specTable(t.speculation)}</div>
      <div class="block"><div class="secthead">Regime tracker</div>
        <div class="regime-box">
          <table><tbody>${regSignals}</tbody></table>
          <div class="regime-flow"><span style="color:var(--muted)">${esc(rt.prev)}</span> →
            <span class="now">${esc(rt.now)}</span></div>
          <div style="font-size:11px;color:var(--muted);margin-top:4px">Direction: ${esc(rt.direction)}</div>
        </div>
      </div>
    </div>
    ${foot(3)}
  </section>`;

  // PAGE 4 — INSIDER SENTIMENT
  let page4ins='';
  if(d.insiderActivity && d.insiderActivity.sectors && d.insiderActivity.sectors.length){
    const ia=d.insiderActivity;
    const th=ia.thresholds||{greenMaxRatio:2,redMinRatio:12};
    const rows=ia.sectors.map(s=>{
      const sig=s.signal ? {key:s.signal,label:{green:'Buying',yellow:'Mixed',red:'Sell-heavy'}[s.signal]||s.signal,ratio:insiderSignal(s.buying,s.selling,th).ratio} : insiderSignal(s.buying,s.selling,th);
      const st=STATUS[sig.key]||STATUS.yellow;
      return `<tr><td>${esc(s.label)}</td>
        <td class="num-col">${fmtDollar(s.buying)}</td>
        <td class="num-col">${fmtDollar(s.selling)}</td>
        <td class="num-col">${sig.ratio}</td>
        <td class="num-col"><span class="status-cell"><span class="dot" style="background:${st.c}"></span><span class="badge" style="background:${st.bg};color:${st.c}">${esc(sig.label)}</span></span></td></tr>`;
    }).join('');
    const comp=insiderComposite(ia.sectors, th);
    const cst=STATUS[comp.sig.key]||STATUS.yellow;
    const counts=ia.sectors.reduce((a,s)=>{
      const k=s.signal||insiderSignal(s.buying,s.selling,th).key; a[k]=(a[k]||0)+1; return a;
    },{});
    page4ins=`<section class="page">
      <div class="mast" style="display:flex;justify-content:space-between;align-items:center"><div><div class="eyebrow">${esc(d.date)}</div><h1 style="font-size:22px">Insider Sentiment</h1></div><img src="${LOGO}" style="height:32px" alt="KCI"></div>
      <div class="secthead">Insider buying &amp; selling by sector — ${esc(ia.asOf||'')}</div>
      <table><thead><tr><th>Sector</th><th class="num-col">Buying ($)</th><th class="num-col">Selling ($)</th><th class="num-col">Sell / Buy</th><th class="num-col">Signal</th></tr></thead>
        <tbody>${rows}</tbody></table>
      <div style="display:flex;gap:18px;margin:10px 0 16px;font-size:10px;color:var(--muted);align-items:center">
        <span><span class="dot" style="background:#15803d;display:inline-block;vertical-align:-1px"></span> Buying — insider buying exceeds norms (≤ ${th.greenMaxRatio}× sell/buy)</span>
        <span><span class="dot" style="background:#b88407;display:inline-block;vertical-align:-1px"></span> Mixed</span>
        <span><span class="dot" style="background:#c62828;display:inline-block;vertical-align:-1px"></span> Sell-heavy (≥ ${th.redMinRatio}×)</span>
      </div>
      <div class="grid2">
        <div class="regime-box">
          <div class="secthead" style="border:none;padding:0;margin-bottom:6px">Composite read</div>
          <div style="display:flex;align-items:center;gap:10px">
            <span class="dot" style="background:${cst.c};width:16px;height:16px"></span>
            <span style="font-family:var(--serif);font-size:18px;font-weight:700">${esc(comp.sig.label)}</span>
            <span style="font-size:12px;color:var(--muted)">overall sell/buy ${comp.sig.ratio}</span>
          </div>
          <div style="font-size:11.5px;margin-top:8px;color:var(--muted)">
            Total buying ${fmtDollar(comp.totalBuy)} vs selling ${fmtDollar(comp.totalSell)} ·
            ${counts.green||0} green / ${counts.yellow||0} yellow / ${counts.red||0} red</div>
        </div>
        <div class="regime-box">
          <div class="secthead" style="border:none;padding:0;margin-bottom:6px">How to read it</div>
          <div style="font-size:11.5px;line-height:1.55;color:var(--ink)">
            Insiders always sell more than they buy, so the signal is the <b>ratio</b>, not the raw totals.
            A surge of green in cyclicals (industrials, energy, financials) tends to appear near maximum pessimism.
            A wall of red during expensive markets suggests optimism is running ahead of fundamentals.
            Watch for <b>shifts</b> across weeks, not any single print.</div>
        </div>
      </div>
      ${foot(4)}
    </section>`;
  }

  // PAGE 5 — OPPORTUNITY + ACTIONS
  const fs = d.opportunity.forcedSelling.map(x=>`<tr><td>${esc(x.label)}</td>
    <td class="num-col"><b>${x.score}/10</b></td>
    <td><span class="b-bar" style="display:block"><span class="b-fill" style="width:${x.score*10}%;background:#15803d"></span></span></td></tr>`).join('');
  const bm=d.opportunity.buffettMeter;
  const bmRow=(label,val,col)=>`<div class="bar-row"><span class="bl">${label}</span>
    <span class="track"><span class="fill" style="width:${val*10}%;background:${col}"></span></span>
    <span class="bv">${val}/10</span></div>`;
  const doNow=d.actions.doNow.map(x=>`<li>${esc(x)}</li>`).join('');
  const doNot=d.actions.doNotYet.map(x=>`<li>${esc(x)}</li>`).join('');

  const page4=`<section class="page">
    <div class="mast" style="display:flex;justify-content:space-between;align-items:center"><div><div class="eyebrow">${esc(d.date)}</div><h1 style="font-size:22px">Opportunity &amp; Action</h1></div><img src="${LOGO}" style="height:32px" alt="KCI"></div>
    <div class="grid2">
      <div class="block"><div class="secthead">Forced-selling watchlist</div>
        <table><thead><tr><th>Area</th><th class="num-col">Score</th><th>&nbsp;</th></tr></thead><tbody>${fs}</tbody></table>
      </div>
      <div class="block"><div class="secthead">Opportunity meter</div>
        <div class="bars">
          ${bmRow('Fear', bm.fear, 'var(--o)')}
          ${bmRow('Forced selling', bm.forcedSelling, 'var(--o)')}
          ${bmRow('Opportunity', bm.opportunity, 'var(--g)')}
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5">
          The best entries historically appear when fear and forced selling spike — not before. Read this as a measure of how close conditions are, not a buy signal today.</div>
      </div>
    </div>
    <div class="secthead">Action items</div>
    <div class="actions">
      <div class="act-card do"><h4>${esc(d.actions.doNowLabel||'Worth Watching')}</h4><ul>${doNow}</ul></div>
      <div class="act-card dont"><h4>${esc(d.actions.doNotYetLabel||'Worth Avoiding')}</h4><ul>${doNot}</ul></div>
    </div>
    ${d.disclosure ? `<div class="disclosure"><b>Important disclosures.</b> ${esc(d.disclosure)}</div>` : ''}
    ${foot(5)}
  </section>`;

  return page1+page2+page3+page4ins+page4;
}

/* ---- view-only loader: fetch data.json (authoritative), fall back to bundled copy ---- */
const FALLBACK = TEMPLATE;
async function load(){
  const stage = document.getElementById('stage');
  let data = FALLBACK, note = '';
  try{
    const res = await fetch('data.json?t=' + Date.now(), {cache:'no-store'});
    if(res.ok){ data = await res.json(); }
    else { note = 'Showing bundled data (data.json returned ' + res.status + ').'; }
  }catch(e){
    note = 'Showing bundled data (data.json not reachable — this is normal when opening the file locally).';
  }
  try{
    stage.innerHTML = build(data);
    if(note){
      const n = document.createElement('div');
      n.className = 'localnote no-print'; n.textContent = note;
      stage.insertBefore(n, stage.firstChild);
    }
  }catch(e){
    stage.innerHTML = '<div style="max-width:700px;margin:60px auto;font-family:var(--sans);color:#c62828">Could not render the dashboard: ' + e.message + '</div>';
  }
}
load();

</script>
</body>
</html>
